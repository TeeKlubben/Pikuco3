<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пикуко 3 — тесты и игры от пользователей</title>
<style>
  :root{
    --red:#d0162c;
    --yellow:#f4e238;
    --white:#ffffff;
    --text:#1d1d1d;
    --muted:#6b6b6b;
    --card-border:#eeeeee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--white);color:var(--text)}
  a{text-decoration:none;color:inherit}

  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:var(--white);border-bottom:4px solid var(--yellow);
    position:sticky;top:0;z-index:10}
  .logo{font-size:26px;font-weight:800;color:var(--red);letter-spacing:.5px}
  .logo span{display:inline-block;background:var(--yellow);color:var(--red);
    border-radius:10px;padding:0 8px;margin-left:4px}
  nav{display:flex;gap:10px;align-items:center}
  .btn{display:inline-block;font-weight:700;font-size:15px;padding:10px 18px;border-radius:12px;cursor:pointer;border:none}
  .btn-create{background:var(--red);color:var(--white)}
  .btn-create:hover{background:#a81223}
  .btn-profile{background:var(--yellow);color:var(--red)}
  .btn-profile:hover{background:#e0cb1f}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--yellow);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--red)}
  .user-chip .mini{font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);margin-left:4px}
  .user-chip .mini:hover{color:var(--red)}

  .hero{text-align:center;padding:48px 20px 32px;background:linear-gradient(180deg,var(--yellow) 0%,var(--white) 100%)}
  .hero h1{font-size:34px;color:var(--red);margin-bottom:10px}
  .hero p{color:var(--muted);font-size:17px}

  .tests{padding:24px;max-width:1100px;margin:0 auto}
  .tests h2{color:var(--red);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{border:2px solid var(--card-border);border-radius:16px;padding:16px;background:var(--white);
    transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-4px);border-color:var(--yellow)}
  .card .ava{width:100%;height:110px;border-radius:12px;background:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px}
  .card h3{font-size:17px;margin-bottom:6px}
  .card .author{color:var(--muted);font-size:14px}

  footer{text-align:center;color:var(--muted);padding:24px;font-size:14px;border-top:4px solid var(--yellow);margin-top:32px}

  /* Модальное окно */
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-back.open{display:flex}
  .modal{background:var(--white);border-radius:18px;padding:24px;width:92%;max-width:400px;border-top:6px solid var(--red)}
  .modal h2{color:var(--red);margin-bottom:4px}
  .modal .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:10px;font-weight:700;cursor:pointer;background:#f3f3f3;color:var(--muted)}
  .tab.active{background:var(--yellow);color:var(--red)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:11px 12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px}
  .field input:focus{outline:none;border-color:var(--red)}
  .ava-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
  .ava-opt{font-size:24px;text-align:center;padding:6px 0;border-radius:10px;cursor:pointer;border:2px solid transparent}
  .ava-opt.sel{border-color:var(--red);background:#fff3f4}
  .modal .btn{width:100%;font-size:16px;padding:12px}
  .msg{font-size:14px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:#1a9e3f}
  .close-x{float:right;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
</style>
<base target="_blank">
</head>
<body>

<header>
  <div class="logo">Пикуко<span>3</span></div>
  <nav id="navBox">
    <a href="#" class="btn btn-create" id="createBtn">Создать</a>
  </nav>
</header>

<section class="hero">
  <h1>Тесты и игры, созданные людьми</h1>
  <p>Проходи, оценивай — или создай свой!</p>
</section>

<section class="tests">
  <h2>Тесты пользователей</h2>
  <div class="grid" id="testGrid"></div>
</section>

<footer>Пикуко 3 — пока что сайт для друзей 💛</footer>

<!-- Окно входа / регистрации -->
<div class="modal-back" id="authBack">
  <div class="modal">
    <span class="close-x" id="authClose">&times;</span>
    <h2 id="authTitle">Вход</h2>
    <div class="sub" id="authSub">Войдите, чтобы создавать тесты</div>
    <div class="tabs">
      <div class="tab active" id="tabLogin">Вход</div>
      <div class="tab" id="tabReg">Регистрация</div>
    </div>
    <div class="field">
      <label>Логин</label>
      <input id="loginInput" maxlength="20" placeholder="например, danila_228">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="passInput" type="password" maxlength="60" placeholder="минимум 6 символов">
    </div>
    <div id="avaBlock" style="display:none">
      <div class="field"><label>Аватарка</label></div>
      <div class="ava-grid" id="avaGrid"></div>
    </div>
    <button class="btn btn-create" id="authAction">Войти</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ SUPABASE (Settings -> API) ======
  const SUPABASE_URL = "https://lniuacahjlwcwoyxqntz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pa1-ktdc8x-P4T3pIJzBMg_jWTnMj9_";
  // ==============================================================
  const FAKE_DOMAIN = "@pikuko3.local";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const avatars = ['🙂','😎','🦊','🐱','🐶','🐼','🦉','🐸','🦁','🐯','🦄','🐙','🍕','🎮','🚀','🌵'];
  let pickedAvatar = '🙂';

  // ---- Временные тесты-заглушки (настоящие появятся в редакторе) ----
  const tests = [
    {ava:'🦸', title:'Какой ты супергерой?', author:'Пример'},
    {ava:'🍕', title:'Какая пицца ты сегодня?', author:'Пример'},
    {ava:'🐉', title:'Какой дракон тебя охраняет?', author:'Пример'}
  ];
  const grid = document.getElementById('testGrid');
  tests.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="ava">' + t.ava + '</div><h3>' + t.title + '</h3><div class="author">от ' + t.author + '</div>';
    grid.appendChild(card);
  });

  // ---- Состояние аккаунта ----
  let currentUser = null;
  let currentProfile = null;

  function renderNav() {
    const nav = document.getElementById('navBox');
    nav.innerHTML = '<a href="#" class="btn btn-create" id="createBtn">Создать</a>';
    if (currentUser && currentProfile) {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = '<span>' + currentProfile.avatar + '</span><span>' + escapeHtml(currentProfile.login) + '</span><span class="mini" id="logoutBtn">выйти</span>';
      nav.appendChild(chip);
      document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); };
    } else {
      const btn = document.createElement('a');
      btn.href = '#'; btn.className = 'btn btn-profile'; btn.id = 'profileBtn'; btn.textContent = 'Профиль';
      nav.appendChild(btn);
      btn.onclick = e => { e.preventDefault(); openAuth('Войдите в аккаунт'); };
    }
    document.getElementById('createBtn').onclick = e => {
      e.preventDefault();
      if (currentUser) { alert('Редактор тестов появится на следующем этапе'); }
      else { openAuth('Сначала создайте аккаунт!'); }
    };
  }

  function escapeHtml(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  async function loadProfile(user) {
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
    currentProfile = data;
    renderNav();
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) { currentUser = session.user; await loadProfile(session.user); }
    else { currentUser = null; currentProfile = null; renderNav(); }
  });

  // ---- Окно входа/регистрации ----
  const back = document.getElementById('authBack');
  const tabLogin = document.getElementById('tabLogin');
  const tabReg = document.getElementById('tabReg');
  const avaBlock = document.getElementById('avaBlock');
  const avaGrid = document.getElementById('avaGrid');
  const msg = document.getElementById('authMsg');
  let mode = 'login';

  avatars.forEach(a => {
    const d = document.createElement('div');
    d.className = 'ava-opt' + (a === pickedAvatar ? ' sel' : '');
    d.textContent = a;
    d.onclick = () => {
      pickedAvatar = a;
      document.querySelectorAll('.ava-opt').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
    };
    avaGrid.appendChild(d);
  });

  function openAuth(note) {
    msg.textContent = ''; msg.className = 'msg';
    document.getElementById('authSub').textContent = note || 'Войдите, чтобы создавать тесты';
    back.classList.add('open');
  }
  document.getElementById('authClose').onclick = () => back.classList.remove('open');
  back.onclick = e => { if (e.target === back) back.classList.remove('open'); };

  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle('active', m === 'login');
    tabReg.classList.toggle('active', m === 'reg');
    avaBlock.style.display = m === 'reg' ? 'block' : 'none';
    document.getElementById('authTitle').textContent = m === 'login' ? 'Вход' : 'Регистрация';
    document.getElementById('authAction').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
    msg.textContent = '';
  }
  tabLogin.onclick = () => setMode('login');
  tabReg.onclick = () => setMode('reg');

  document.getElementById('authAction').onclick = async () => {
    const login = document.getElementById('loginInput').value.trim();
    const pass = document.getElementById('passInput').value;
    msg.className = 'msg';

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(login)) { msg.classList.add('err'); msg.textContent = 'Логин: 3-20 символов, только буквы, цифры и _'; return; }
    if (pass.length < 6) { msg.classList.add('err'); msg.textContent = 'Пароль должен быть не короче 6 символов'; return; }

    const email = login.toLowerCase() + FAKE_DOMAIN;
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { msg.classList.add('err'); msg.textContent = 'Неверный логин или пароль'; return; }
      back.classList.remove('open');
    } else {
      const { data: exists } = await sb.from('profiles').select('login').eq('login', login).maybeSingle();
      if (exists) { msg.classList.add('err'); msg.textContent = 'Такой логин уже занят'; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) { msg.classList.add('err'); msg.textContent = 'Ошибка: ' + error.message; return; }
      if (data.user) {
        const { error: perr } = await sb.from('profiles').insert({ id: data.user.id, login, avatar: pickedAvatar });
        if (perr) { msg.classList.add('err'); msg.textContent = 'Ошибка сохранения профиля'; return; }
        msg.classList.add('ok'); msg.textContent = 'Аккаунт создан! Входим...';
        await sb.auth.signInWithPassword({ email, password: pass });
        back.classList.remove('open');
      }
    }
    document.getElementById('passInput').value = '';
  };

  // Проверка сессии при загрузке
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) { currentUser = data.session.user; await loadProfile(data.session.user); }
    else renderNav();
  })();
</script>

</body>
</html>
